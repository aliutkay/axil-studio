# Runs the test suite (tests/) on every push and pull request:
#   part 1  input -> spec   (address map, tools, command line)
#   part 2  spec  -> HDL    (golden files, iverilog simulations)
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (iverilog, Qt runtime libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -v
