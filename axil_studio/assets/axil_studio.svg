<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0B1F5C"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6FF"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- bus lines: two masters on the left, three slaves on the right, through the crossbar -->
  <g stroke="#7FB2FF" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M52 98 H96"/>
    <path d="M52 158 H96"/>
    <path d="M160 78 H204"/>
    <path d="M160 128 H204"/>
    <path d="M160 178 H204"/>
  </g>
  <g fill="#7FB2FF">
    <circle cx="48" cy="98" r="14"/>
    <circle cx="48" cy="158" r="14"/>
    <circle cx="208" cy="78" r="14"/>
    <circle cx="208" cy="128" r="14"/>
    <circle cx="208" cy="178" r="14"/>
  </g>
  <!-- crossbar block -->
  <rect x="92" y="60" width="72" height="136" rx="16" fill="url(#chip)"/>
  <!-- every master reaches every slave -->
  <g stroke="#1D4ED8" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M108 98 L148 78"/>
    <path d="M108 98 L148 128"/>
    <path d="M108 98 L148 178"/>
    <path d="M108 158 L148 78"/>
    <path d="M108 158 L148 128"/>
    <path d="M108 158 L148 178"/>
  </g>
  <g fill="#1D4ED8">
    <circle cx="108" cy="98" r="7"/>
    <circle cx="108" cy="158" r="7"/>
    <circle cx="148" cy="78" r="7"/>
    <circle cx="148" cy="128" r="7"/>
    <circle cx="148" cy="178" r="7"/>
  </g>
</svg>
